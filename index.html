<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Phòng Trực Tuyến — Lụa Vàng Resort &amp; Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <div class="header-inner">
      <div class="hotel-name">Lụa Vàng</div>
      <div class="hotel-sub" data-i18n-html="hotel-sub">Resort &amp; Spa &ensp;·&ensp; Cổng Đặt Phòng Trực Tiếp</div>
    </div>
    <div class="lang-toggle" id="lang-toggle" role="group" aria-label="Language / Ngôn ngữ">
      <span class="lang-opt active" data-lang="vi">VI</span>
      <span class="lang-sep">|</span>
      <span class="lang-opt" data-lang="en">EN</span>
    </div>
  </header>

  <main>
    <!-- BƯỚC 1: TÌM PHÒNG -->
    <section class="step" id="search-section">
      <div class="step-tag" data-i18n="step1-tag">Bước 1</div>
      <h2 data-i18n="step1-h2">Tìm phòng trống</h2>

      <div class="date-row">
        <div class="field">
          <label for="check-in" data-i18n="label-checkin">Ngày nhận phòng</label>
          <input type="date" id="check-in">
        </div>
        <span class="date-arrow">→</span>
        <div class="field">
          <label for="check-out" data-i18n="label-checkout">Ngày trả phòng</label>
          <input type="date" id="check-out">
        </div>
      </div>

      <button class="btn btn-primary" id="search-btn" data-i18n="btn-search">Kiểm tra phòng trống</button>
      <div id="search-status" class="msg hidden"></div>
      <div id="rooms-container"></div>
    </section>

    <!-- BƯỚC 2: XÁC NHẬN ĐẶT PHÒNG -->
    <section class="step" id="book-section">
      <div class="step-tag" data-i18n="step2-tag">Bước 2</div>
      <h2 data-i18n="step2-h2">Xác nhận thông tin đặt phòng</h2>

      <div class="field">
        <label for="selected-room" data-i18n="label-room">Phòng đã chọn</label>
        <input type="text" id="selected-room"
               placeholder="Chọn phòng từ danh sách bên trên"
               data-i18n-placeholder="ph-room" readonly>
      </div>

      <div class="field">
        <label for="guest-name" data-i18n="label-guest">Họ và tên khách lưu trú</label>
        <input type="text" id="guest-name"
               placeholder="Nguyễn Văn A"
               data-i18n-placeholder="ph-guest">
      </div>

      <div class="date-row">
        <div class="field">
          <label for="guest-email" data-i18n="label-email">Địa chỉ Email <span style="color:var(--gold-dim);font-weight:500" data-i18n="label-email-note">(để nhận phiếu xác nhận)</span></label>
          <input type="email" id="guest-email"
                 placeholder="guest@domain.com"
                 data-i18n-placeholder="ph-email">
        </div>
        <div class="field">
          <label for="guest-phone" data-i18n="label-phone">Số điện thoại liên hệ</label>
          <input type="tel" id="guest-phone"
                 placeholder="0901 234 567"
                 data-i18n-placeholder="ph-phone">
        </div>
      </div>

      <button class="btn btn-primary" id="book-btn" data-i18n="btn-book">Xác nhận đặt phòng</button>
      <div id="book-status" class="msg hidden"></div>
      <div id="booking-result" class="booking-panel hidden"></div>
    </section>

    <!-- BƯỚC 3: HỦY ĐẶT PHÒNG -->
    <section class="step" id="cancel-section">
      <div class="step-tag" data-i18n="cancel-tag">Quản lý đặt phòng</div>
      <h2 data-i18n="cancel-h2">Tra cứu và hủy mã đặt phòng</h2>

      <div class="field">
        <label for="booking-id-input" data-i18n="label-bid">Mã đặt phòng (Booking ID)</label>
        <input type="text" id="booking-id-input"
               placeholder="Nhập mã đặt phòng vào đây…"
               data-i18n-placeholder="ph-bid">
      </div>

      <button class="btn btn-cancel" id="cancel-btn" data-i18n="btn-cancel">Hủy đặt phòng</button>
      <div id="cancel-status" class="msg hidden"></div>
    </section>
  </main>

  <footer>
    <p data-i18n="footer-text">Lụa Vàng Resort &amp; Spa · Cổng đặt phòng trực tuyến chính thức · 2026</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
