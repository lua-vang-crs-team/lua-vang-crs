<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lua Vang CRS Test</title>
</head>

<body>
  <h1>Lua Vang CRS</h1>

  <button id="testBtn">Test backend</button>
  <p id="status">Not tested yet.</p>

  <script>
    const FUNCTION_URL =
      "https://scxjezoysmwyumyebuls.supabase.co/functions/v1/ping";

    const ANON_KEY =
      "sb_publishable_rXMZpqv_C-N3ojDXI5xNKA_3L_0oD8w";

    document.getElementById("testBtn").addEventListener("click", async () => {
      const status = document.getElementById("status");

      status.textContent = "Testing...";

      try {
        const response = await fetch(FUNCTION_URL, {
          method: "POST",
          headers: {
            "Authorization": `Bearer ${ANON_KEY}`,
            "apikey": ANON_KEY,
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            name: "Functions"
          })
        });

        const data = await response.json();

        if (response.ok && data.ok === true) {
          status.textContent =
            "✅ Connection successful: " + data.message;
        } else {
          status.textContent =
            "❌ Backend error: " + JSON.stringify(data);
        }

      } catch (error) {
        status.textContent =
          "❌ Connection failed: " + error.message;
      }
    });
  </script>
</body>
</html>
