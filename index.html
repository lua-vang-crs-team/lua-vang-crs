<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đặt Phòng — Lụa Vàng Resort &amp; Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══════════════════════════ HEADER ═══════════════════════════ -->
  <header>
    <div class="header-inner">
      <div class="hotel-name">Lụa Vàng</div>
      <div class="hotel-sub">Resort &amp; Spa &ensp;·&ensp; Hệ thống đặt phòng</div>
    </div>
  </header>

  <main>

    <!-- ═══════════════════════════ STEP 1: SEARCH ════════════════════════════ -->
    <section class="step" id="search-section">
      <div class="step-tag">Bước 1</div>
      <h2>Tìm phòng trống</h2>

      <div class="date-row">
        <div class="field">
          <label for="check-in">Ngày nhận phòng</label>
          <input type="date" id="check-in">
        </div>
        <span class="date-arrow">→</span>
        <div class="field">
          <label for="check-out">Ngày trả phòng</label>
          <input type="date" id="check-out">
        </div>
      </div>

      <button class="btn btn-primary" id="search-btn">Kiểm tra phòng trống</button>
      <div id="search-status" class="msg hidden"></div>
      <div id="rooms-container"></div>
    </section>

    <!-- ═══════════════════════════ STEP 2: BOOK ══════════════════════════════ -->
    <section class="step" id="book-section">
      <div class="step-tag">Bước 2</div>
      <h2>Xác nhận đặt phòng</h2>

      <div class="field">
        <label for="selected-room">Mã phòng đã chọn</label>
        <input type="text" id="selected-room"
               placeholder="Chọn phòng từ kết quả bên trên" readonly>
      </div>
      <div class="field">
        <label for="guest-name">Tên khách lưu trú</label>
        <input type="text" id="guest-name" placeholder="Họ và tên đầy đủ">
      </div>

      <button class="btn btn-primary" id="book-btn">Xác nhận đặt phòng</button>
      <div id="book-status" class="msg hidden"></div>

      <!-- Booking ID result box -->
      <div id="booking-result" class="booking-panel hidden">
        <!-- filled by JS -->
      </div>
    </section>

    <!-- ═══════════════════════════ STEP 3: CANCEL ════════════════════════════ -->
    <section class="step" id="cancel-section">
      <div class="step-tag">Hủy đặt phòng</div>
      <h2>Nhập mã để hủy</h2>

      <div class="field">
        <label for="booking-id-input">Mã đặt phòng (Booking ID)</label>
        <input type="text" id="booking-id-input"
               placeholder="Dán mã đặt phòng vào đây…">
      </div>

      <button class="btn btn-cancel" id="cancel-btn">Hủy đặt phòng</button>
      <div id="cancel-status" class="msg hidden"></div>
    </section>

  </main>

  <footer>
    <p>Lụa Vàng Resort &amp; Spa &ensp;·&ensp; Hệ thống quản lý đặt phòng nội bộ &ensp;·&ensp; 2026</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
