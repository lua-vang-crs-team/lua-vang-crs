
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book Your Stay — Lụa Vàng Resort &amp; Spa</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══════════════════════════ HEADER ═══════════════════════════ -->
  <header>
    <div class="header-inner">
      <div class="hotel-name">Lụa Vàng</div>
      <div class="hotel-sub">Resort &amp; Spa &ensp;·&ensp; Online Reservations</div>
    </div>
  </header>

  <main>

    <!-- ═══════════════════════════ STEP 1: SEARCH ════════════════════════════ -->
    <section class="step" id="search-section">
      <div class="step-tag">Step 1</div>
      <h2>Find Your Room</h2>

      <div class="date-row">
        <div class="field">
          <label for="check-in">Check-in Date</label>
          <input type="date" id="check-in">
        </div>
        <span class="date-arrow">→</span>
        <div class="field">
          <label for="check-out">Check-out Date</label>
          <input type="date" id="check-out">
        </div>
      </div>

      <button class="btn btn-primary" id="search-btn">Check Availability</button>
      <div id="search-status" class="msg hidden"></div>
      <div id="rooms-container"></div>
    </section>

    <!-- ═══════════════════════════ STEP 2: BOOK ══════════════════════════════ -->
    <section class="step" id="book-section">
      <div class="step-tag">Step 2</div>
      <h2>Complete Your Reservation</h2>

      <div class="field">
        <label for="selected-room">Selected Room ID</label>
        <input type="text" id="selected-room"
               placeholder="Select a room from the results above" readonly>
      </div>
      <div class="field">
        <label for="guest-name">Guest Name</label>
        <input type="text" id="guest-name" placeholder="Enter your full name">
      </div>

      <button class="btn btn-primary" id="book-btn">Confirm Booking</button>
      <div id="book-status" class="msg hidden"></div>

      <!-- Booking ID result box -->
      <div id="booking-result" class="booking-panel hidden">
        <!-- filled by JS -->
      </div>
    </section>

    <!-- ═══════════════════════════ STEP 3: CANCEL ════════════════════════════ -->
    <section class="step" id="cancel-section">
      <div class="step-tag">Manage Your Booking</div>
      <h2>Cancel a Reservation</h2>

      <div class="field">
        <label for="booking-id-input">Booking ID</label>
        <input type="text" id="booking-id-input"
               placeholder="Enter or paste your Booking ID here…">
      </div>

      <button class="btn btn-cancel" id="cancel-btn">Cancel Booking</button>
      <div id="cancel-status" class="msg hidden"></div>
    </section>

  </main>

  <footer>
    <p>Lụa Vàng Resort &amp; Spa &ensp;·&ensp; Hotel Reservation System &ensp;·&ensp; 2026</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
